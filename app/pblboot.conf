# HWV loaded by pblboot: linked at pblboot's firmware partition. Build with
#   west build -b cyberdeck_evt3/nrf52840 pebble-hwv/app -- \
#     -DEXTRA_CONF_FILE=pblboot.conf -DEXTRA_DTC_OVERLAY_FILE=pblboot.overlay
CONFIG_FLASH_LOAD_OFFSET=0x8000
CONFIG_FLASH_LOAD_SIZE=0xf8000
CONFIG_HWV_PBLBOOT=y
CONFIG_CRC=y
CONFIG_REBOOT=y
